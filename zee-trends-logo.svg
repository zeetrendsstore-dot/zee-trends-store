<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <!-- Outer Crest Monogram Box -->
  <rect x="5" y="5" width="60" height="60" rx="8" fill="#121212" stroke="#D4AF37" stroke-width="2"/>
  <rect x="9" y="9" width="52" height="52" rx="5" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Gold Monogram ZT -->
  <text x="35" y="44" font-family="'Cormorant Garamond', serif, 'Times New Roman'" font-size="28" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="1">ZT</text>
  
  <!-- Brand Name Typography -->
  <text x="78" y="38" font-family="'Cormorant Garamond', serif, 'Times New Roman'" font-size="26" font-weight="700" fill="#121212" letter-spacing="3">ZEE TRENDS</text>
  <text x="78" y="54" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="11" font-weight="700" fill="#B2883B" letter-spacing="5">ONLINE STORE</text>
</svg>
